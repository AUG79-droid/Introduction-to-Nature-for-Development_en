<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An applied introduction to sustainability decision-making across the aviation life cycle.">
  <meta name="theme-color" content="#0b2947">
  <title>Introduction to Sustainability in Aviation</title>
  <style>
    :root {
      --navy: #0b2947;
      --navy-2: #123f68;
      --teal: #087d78;
      --teal-soft: #dff4f1;
      --amber: #d9781e;
      --amber-soft: #fff0dc;
      --blue-soft: #eaf3fb;
      --ink: #172638;
      --muted: #536579;
      --line: #d6e0e8;
      --paper: #ffffff;
      --canvas: #f3f6f8;
      --success: #176b4d;
      --success-soft: #e4f4ec;
      --danger: #9d342e;
      --danger-soft: #fdebea;
      --shadow: 0 18px 48px rgba(11, 41, 71, .10);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: var(--navy-2); }
    :focus-visible { outline: 4px solid rgba(217,120,30,.38); outline-offset: 3px; }
    .skip-link {
      position: fixed; left: 16px; top: -80px; z-index: 100;
      background: var(--paper); color: var(--navy); padding: 12px 18px;
      border-radius: 12px; font-weight: 800; box-shadow: var(--shadow);
    }
    .skip-link:focus { top: 16px; }
    .site-header {
      position: sticky; top: 0; z-index: 40;
      background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1240px; margin: auto; padding: 13px 24px;
      display: grid; grid-template-columns: minmax(260px,1fr) minmax(220px,380px) auto;
      align-items: center; gap: 22px;
    }
    .course-name { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); line-height: 1.15; }
    .course-name small { color: var(--teal); font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .15em; margin-bottom: 5px; }
    .course-name strong { font-size: 17px; }
    .header-progress { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
    .header-progress span { color: var(--muted); font-size: 13px; font-weight: 750; }
    .progress-track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: #e2e9ee; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg,var(--teal),#31a79f); transition: width .35s ease; }
    .header-actions { display: flex; gap: 9px; }
    .btn {
      border: 1px solid var(--line); border-radius: 13px; background: var(--paper);
      padding: 11px 16px; font-weight: 800; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(11,41,71,.10); }
    .btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
    .btn-teal { background: var(--teal); border-color: var(--teal); color: #fff; }
    .btn-quiet { background: transparent; }
    .btn:disabled { opacity: .46; cursor: not-allowed; transform: none; box-shadow: none; }
    main { min-height: calc(100vh - 150px); }
    .container { max-width: 1240px; margin: 0 auto; padding: 34px 24px 70px; }
    .hero {
      overflow: hidden; position: relative; border-radius: 30px; color: #fff;
      background: linear-gradient(125deg,#081f37 0%,#0e3d62 54%,#087d78 100%);
      padding: clamp(34px,6vw,76px); box-shadow: var(--shadow);
    }
    .hero::after {
      content: ""; position: absolute; width: 460px; height: 460px; right: -130px; top: -170px;
      border: 68px solid rgba(255,255,255,.07); border-radius: 50%;
    }
    .hero-copy { max-width: 780px; position: relative; z-index: 2; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--amber); border-radius: 4px; }
    h1 { font-size: clamp(42px,6vw,76px); line-height: .98; letter-spacing: -.052em; margin: 24px 0 22px; max-width: 900px; }
    .hero p { font-size: clamp(18px,2vw,22px); line-height: 1.55; color: #e6f0f7; max-width: 760px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .hero .btn-primary { color: var(--navy); background: #fff; border-color: #fff; }
    .hero .btn-quiet { color: #fff; border-color: rgba(255,255,255,.38); }
    .course-facts { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-top: 34px; }
    .fact { border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.09); padding: 15px 16px; border-radius: 16px; }
    .fact strong { display: block; font-size: 20px; }
    .fact span { color: #d8e8f3; font-size: 13px; }
    .section-head { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin: 56px 0 22px; }
    .section-head h2 { margin: 0; font-size: clamp(30px,4vw,46px); line-height: 1.05; letter-spacing: -.035em; }
    .section-head p { margin: 0; max-width: 600px; color: var(--muted); }
    .framework { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    .framework-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: 0 8px 24px rgba(11,41,71,.055); }
    .framework-card b { display: grid; place-items: center; width: 38px; height: 38px; color: #fff; background: var(--navy); border-radius: 12px; margin-bottom: 18px; }
    .framework-card h3 { margin: 0 0 8px; font-size: 19px; }
    .framework-card p { margin: 0; color: var(--muted); font-size: 15px; }
    .how-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    .how-card { background: var(--blue-soft); padding: 24px; border-radius: var(--radius); border: 1px solid #cfe1ef; }
    .how-card span { color: var(--teal); font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
    .how-card h3 { margin: 7px 0; font-size: 21px; }
    .how-card p { margin: 0; color: var(--muted); }
    .module-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .module-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 24px;
      display: grid; grid-template-columns: auto 1fr; gap: 18px; position: relative; overflow: hidden;
    }
    .module-card.complete { border-color: #9acdb6; background: linear-gradient(145deg,#fff 60%,#edf8f3); }
    .module-no { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 15px; color: #fff; background: var(--navy); font-weight: 900; font-size: 19px; }
    .module-card.complete .module-no { background: var(--success); }
    .module-card h3 { margin: 0 0 7px; font-size: 23px; line-height: 1.15; }
    .module-card p { color: var(--muted); margin: 0 0 16px; }
    .module-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 17px; }
    .pill { display: inline-flex; padding: 6px 10px; border: 1px solid var(--line); background: #f7f9fa; color: var(--muted); border-radius: 999px; font-size: 12px; font-weight: 800; }
    .pill.done { background: var(--success-soft); border-color: #b6ddca; color: var(--success); }
    .notice { margin-top: 28px; padding: 18px 20px; border-left: 5px solid var(--amber); background: var(--amber-soft); border-radius: 0 16px 16px 0; color: #593511; }
    .module-shell { max-width: 1100px; margin: 0 auto; }
    .module-top { display: flex; justify-content: space-between; gap: 20px; align-items: start; margin-bottom: 22px; }
    .module-top h1 { color: var(--navy); font-size: clamp(38px,5vw,62px); margin: 12px 0 12px; max-width: 850px; }
    .module-lead { font-size: 20px; color: var(--muted); max-width: 820px; margin: 0; }
    .module-body { display: grid; gap: 18px; }
    .learning-card, .theory-card, .case-card, .check-card, .completion-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: clamp(22px,4vw,38px);
      box-shadow: 0 10px 30px rgba(11,41,71,.055);
    }
    .learning-card { background: var(--blue-soft); border-color: #c9deed; }
    .learning-card h2, .theory-card h2, .case-card h2, .check-card h2 { margin: 0 0 14px; font-size: 28px; line-height: 1.15; }
    .learning-card ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
    .theory-card h3 { font-size: 22px; margin: 28px 0 9px; }
    .theory-card h3:first-child { margin-top: 0; }
    .theory-card p { color: #34475b; font-size: 17px; line-height: 1.78; margin: 0 0 15px; }
    .lens { margin: 24px 0 2px; padding: 20px 22px; border-radius: 17px; background: var(--teal-soft); border-left: 5px solid var(--teal); }
    .lens strong { display: block; color: #075d59; font-size: 12px; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 7px; }
    .lens p { margin: 0; color: #174b49; }
    .diagram { margin: 24px 0; display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; align-items: stretch; }
    .diagram div { position: relative; min-height: 94px; background: var(--blue-soft); border: 1px solid #c9deed; border-radius: 15px; padding: 14px 10px; text-align: center; display: grid; place-content: center; font-weight: 850; color: var(--navy); }
    .diagram div:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 33px; z-index: 2; color: var(--amber); font-size: 24px; }
    .matrix { width: 100%; border-collapse: collapse; margin: 22px 0; }
    .matrix th { text-align: left; background: var(--navy); color: #fff; padding: 13px 15px; }
    .matrix th:first-child { border-radius: 12px 0 0 0; }
    .matrix th:last-child { border-radius: 0 12px 0 0; }
    .matrix td { padding: 14px 15px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .matrix tr:nth-child(even) td { background: #f7f9fb; }
    .case-card { border-top: 6px solid var(--amber); }
    .case-label { color: var(--amber); font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .case-data { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin: 20px 0; }
    .data-point { background: var(--amber-soft); border: 1px solid #f0d0a8; padding: 15px; border-radius: 14px; }
    .data-point strong { display: block; font-size: 13px; color: #7a4211; }
    .options { display: grid; gap: 10px; margin-top: 18px; }
    .option {
      width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 16px;
      padding: 16px 18px; cursor: pointer; font-weight: 700; line-height: 1.5;
    }
    .option:hover { border-color: #85a6c0; background: #f8fbfd; }
    .option.selected { border-color: var(--navy-2); background: var(--blue-soft); }
    .option.correct { border-color: var(--success); background: var(--success-soft); }
    .option.incorrect { border-color: var(--danger); background: var(--danger-soft); }
    .feedback { margin-top: 16px; padding: 17px 19px; border-radius: 15px; font-weight: 650; }
    .feedback.good { color: #124c38; background: var(--success-soft); }
    .feedback.bad { color: #762621; background: var(--danger-soft); }
    .check-card { border-top: 6px solid var(--teal); }
    .question { font-size: 21px; font-weight: 850; line-height: 1.4; margin: 10px 0 18px; }
    .completion-card { text-align: center; background: linear-gradient(135deg,#eef8f6,#fff); }
    .completion-card p { color: var(--muted); }
    .module-nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .assessment-lock { text-align: center; padding: 34px; border: 2px dashed #b9c7d3; border-radius: 22px; color: var(--muted); }
    .assessment-list { display: grid; gap: 18px; }
    .assessment-question { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
    .assessment-question h3 { margin: 0 0 15px; font-size: 19px; line-height: 1.45; }
    .assessment-question .option { font-weight: 600; }
    .result-panel { text-align: center; padding: 42px; border-radius: 26px; background: var(--paper); border: 1px solid var(--line); }
    .score { font-size: 76px; line-height: 1; font-weight: 950; letter-spacing: -.06em; color: var(--navy); }
    .certificate { margin-top: 22px; padding: 42px; border: 8px double var(--navy); background: #fffdfa; text-align: center; }
    .certificate h2 { font-family: Georgia,serif; font-size: 42px; color: var(--navy); margin: 10px 0; }
    .certificate p { color: var(--muted); }
    .site-footer { border-top: 1px solid var(--line); background: #fff; }
    .footer-inner { max-width: 1240px; margin: auto; padding: 22px 24px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 20px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 900px) {
      .header-inner { grid-template-columns: 1fr auto; }
      .header-progress { grid-row: 2; grid-column: 1 / -1; }
      .framework, .course-facts { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .module-grid, .how-grid { grid-template-columns: 1fr; }
      .diagram { grid-template-columns: repeat(3,1fr); }
      .diagram div::after { display: none; }
      .case-data { grid-template-columns: 1fr; }
      .section-head { display: block; }
      .section-head p { margin-top: 10px; }
    }
    @media (max-width: 560px) {
      .container { padding: 22px 14px 54px; }
      .header-inner { padding: 11px 14px; }
      .header-actions .btn-quiet { display: none; }
      .hero { border-radius: 22px; padding: 32px 22px; }
      h1 { font-size: 42px; }
      .course-facts, .framework { grid-template-columns: 1fr; }
      .module-card { grid-template-columns: 1fr; }
      .diagram { grid-template-columns: 1fr 1fr; }
      .module-top { display: block; }
      .footer-inner { display: block; }
    }
    @media print {
      .site-header, .site-footer, .module-nav, .hero-actions, .btn { display: none !important; }
      body { background: #fff; }
      .container { padding: 0; }
      .certificate { break-inside: avoid; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="course-name" href="#overview" aria-label="Return to course overview">
        <small>Aviation sustainability learning</small>
        <strong>Introduction to Sustainability in Aviation</strong>
      </a>
      <div class="header-progress">
        <span>Course progress</span><span id="progressText">0%</span>
        <div class="progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="header-actions">

      </div>

  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>Independent educational resource · No third-party course branding or visual assets.</span>
      <span>Illustrative scenarios are not engineering instructions or corporate policy.</span>
    </div>
  </footer>
  <script>
    const MODULES = [
      {
        id: 1,
        title: "Sustainability as a decision system",
        subtitle: "Move beyond isolated indicators and understand how environmental, operational, social and economic consequences interact.",
        duration: "30 min",
        objectives: [
          "Distinguish sustainability from a collection of environmental initiatives.",
          "Use impacts, dependencies, risks and opportunities as four complementary decision lenses.",
          "Recognise boundary choices and avoid shifting burdens to another life-cycle stage."
        ],
        sections: [
          {
            title: "Why aviation needs systems thinking",
            paragraphs: [
              "Aviation decisions are made inside a tightly constrained system. Safety, airworthiness, mission readiness, cost, lead time, industrial capability, working conditions and environmental performance are not separate realities; they are simultaneous conditions of the same decision. Sustainability therefore cannot be reduced to a checklist completed after the technical choice has already been made.",
              "A sustainable decision protects long-term capability while understanding who or what carries the consequences. A change that improves one indicator at a production site may increase material criticality, maintenance burden or end-of-life difficulty. Likewise, a rapid logistics solution may protect immediate availability while creating a pattern of repeated emergency transport. Systems thinking makes these transfers visible before they become embedded in normal practice."
            ]
          },
          {
            title: "Four lenses for a complete first assessment",
            paragraphs: [
              "Impacts are the changes an activity causes: habitat disturbance, resource demand, worker exposure or waste generation. Dependencies are the conditions the activity relies on, such as stable supply chains, functioning land, water availability, skilled repair capability or access to specific minerals. Risks describe how impacts and dependencies may affect objectives. Opportunities are credible ways to improve resilience, retain value or reduce exposure.",
              "These lenses prevent a common mistake: treating sustainability only as the footprint produced by an organisation. Aviation also depends on ecological, social and industrial systems. A robust assessment asks both what the activity changes and what the activity needs in order to remain viable."
            ],
            lens: "Decision lens: define the operational need first, then test alternatives against the same functional requirement. Comparing unlike functions produces misleading conclusions."
          },
          {
            title: "Boundaries, time and trade-offs",
            paragraphs: [
              "Every assessment has a boundary. A site boundary captures local operations but may hide upstream extraction or downstream treatment. A procurement boundary may include the supplier but omit maintenance. A short time horizon may favour a low-cost option that locks in future obsolescence. Boundaries are necessary, but they must be explicit.",
              "Trade-offs are not evidence of failure; hidden trade-offs are. Decision quality improves when teams document what is included, what is excluded, where uncertainty remains and which groups or life-cycle stages receive the benefit or burden. This creates a traceable basis for review instead of a vague claim that one option is simply ‘more sustainable’."
            ]
          }
        ],
        diagram: ["Need", "Alternatives", "Impacts", "Dependencies", "Trade-offs", "Evidence"],
        caseStudy: {
          title: "A400M component recovery decision",
          scenario: "A serviceable component has failed inspection. The team must restore availability without changing the approved functional requirement.",
          data: ["New unit: available in 24 h; full traceability; highest material demand", "Consolidated delivery: 5 days; lower transport intensity; mission delay", "Approved repair: 36 h; retains most component value; verified test capability"],
          options: [
            "Always buy the new unit because availability is the only relevant sustainability condition.",
            "Use the approved repair, provided the 36-hour window meets the mission need and release evidence is complete.",
            "Wait five days because the option with lower transport intensity must always win."
          ],
          correct: 1,
          feedback: [
            "Too narrow. Immediate availability matters, but treating it as the only condition prevents a comparison of value retention, repeatability and evidence.",
            "Best answer. It maintains the required function, preserves embedded value and remains conditional on mission timing, approved capability and release evidence.",
            "A single environmental indicator cannot override the functional requirement. The delay may create operational consequences or trigger a later emergency response."
          ]
        },
        check: {
          q: "Which statement best describes a systems approach to sustainability?",
          options: ["Optimise one environmental metric regardless of operational consequences.", "Compare alternatives against the same need and make impacts, dependencies, trade-offs and evidence explicit.", "Choose the lowest-cost option and document environmental aspects afterwards."],
          correct: 1,
          explain: "A systems approach keeps the functional requirement stable and makes interactions and transfers visible."
        }
      },
      {
        id: 2,
        title: "Life-cycle thinking for aircraft and services",
        subtitle: "Understand where impacts occur from design and sourcing to operation, support and end-of-life.",
        duration: "35 min",
        objectives: [
          "Map the principal stages of an aircraft or service life cycle.",
          "Explain functional unit, baseline, data quality and burden shifting in plain language.",
          "Use life-cycle evidence proportionately without pretending that uncertain data are exact."
        ],
        sections: [
          {
            title: "The life cycle is a chain of connected decisions",
            paragraphs: [
              "An aircraft accumulates consequences long before its first flight and long after delivery. Concept selection influences materials and architectures. Procurement decisions influence extraction, processing and supplier practices. Manufacturing establishes yields, treatments and repairability. Operation creates maintenance and logistics patterns. Upgrades can extend capability or add complexity. Retirement determines whether high-value components and materials are recovered or lost.",
              "Life-cycle thinking is the discipline of following those connections. It does not mean producing a full life-cycle assessment for every minor choice. It means selecting a level of analysis proportionate to the decision and refusing to declare a benefit based only on the stage where it is easiest to measure."
            ]
          },
          {
            title: "Functional unit, baseline and scenarios",
            paragraphs: [
              "A comparison needs a common function. Comparing one kilogram of two materials is not enough if one material requires more mass, different inspection intervals or shorter service life. In a maintenance service, the function may be one verified serviceable component available for a defined operating period. In a retrofit, it may be the capability delivered over the remaining platform life.",
              "The baseline describes what would happen without the proposed change. Alternatives then use consistent assumptions about life, utilisation, repair, logistics and end-of-life. Scenario ranges are often more honest than a single number. If the result changes completely when one uncertain assumption moves slightly, the decision is sensitive and requires additional evidence."
            ],
            lens: "Evidence rule: report assumptions and ranges alongside results. Precision in the spreadsheet does not guarantee accuracy in the decision."
          },
          {
            title: "Avoiding burden shifting",
            paragraphs: [
              "Burden shifting occurs when an apparent improvement in one place creates a larger problem elsewhere. A lighter component may depend on a more critical material. A durable coating may complicate worker protection or end-of-life treatment. A central repair model may improve utilisation of expertise but increase emergency transport. A new digital service may reduce physical travel while increasing infrastructure and obsolescence demands.",
              "The purpose of life-cycle thinking is not to eliminate every trade-off. It is to identify material trade-offs early enough to redesign, create controls or select a better alternative."
            ]
          }
        ],
        diagram: ["Design", "Materials", "Production", "Operation", "In-service", "Recovery"],
        caseStudy: {
          title: "Eurofighter display-unit retrofit",
          scenario: "A proposed display unit is lighter and uses less power, but it contains a hard-to-separate bonded assembly and a mineral with limited supplier traceability.",
          data: ["8% lower unit mass", "12% lower in-use power demand", "Repair requires replacement of the full bonded assembly"],
          options: [
            "Approve based on lower mass and power because use-phase gains always dominate.",
            "Reject immediately because every critical material makes an improvement impossible.",
            "Request a life-cycle comparison including service life, repair frequency, supplier evidence and recovery scenarios before deciding."
          ],
          correct: 2,
          feedback: [
            "Incomplete. The reported gains are relevant, but they do not resolve repairability, material risk or service-life performance.",
            "Premature. Material criticality is a decision factor, not an automatic veto; alternatives and controls must be assessed.",
            "Best answer. It preserves the claimed advantages while testing whether they remain beneficial across the required function and life cycle."
          ]
        },
        check: {
          q: "Why is a functional unit essential when comparing alternatives?",
          options: ["It ensures alternatives deliver the same defined function over a comparable period.", "It guarantees that environmental data have no uncertainty.", "It allows teams to exclude maintenance from the assessment."],
          correct: 0,
          explain: "A common function prevents comparisons between options that do not deliver equivalent performance."
        }
      },
      {
        id: 3,
        title: "Circularity, maintenance and retained value",
        subtitle: "Connect repair, reuse, modularity and obsolescence management with airworthiness and long-term capability.",
        duration: "30 min",
        objectives: [
          "Use the value-retention hierarchy instead of treating recycling as the default circular strategy.",
          "Recognise the technical and documentary conditions required for safe reuse and repair.",
          "Identify how design choices influence future maintenance and obsolescence."
        ],
        sections: [
          {

          ${state.completed.length === MODULES.length
            ? `<button class="btn btn-teal" type="button" data-go="assessment">Open final assessment</button>`
            : `<div class="assessment-lock">Complete all eight module checkpoints to unlock the final assessment. ${state.completed.length} of ${MODULES.length} modules completed.</div>`}

          <div class="notice"><strong>Use of scenarios:</strong> A400M and Eurofighter references are illustrative learning contexts. The course does not replace approved technical data, airworthiness decisions, operational procedures or corporate policy.</div>
        </div>`;
      bindCommon();
    }

    function renderModule(id){
      const m = MODULES.find(x => x.id === id);
      if (!m) return go("overview");
      const caseAnswer = state.cases[id];
      const checkAnswer = state.checks[id];
      const checkPassed = Number(checkAnswer) === m.check.correct;
      document.getElementById("main").innerHTML = `
        <div class="container module-shell">
          <div class="module-top">
            <div><span class="eyebrow">Module ${m.id} · ${escapeHtml(m.duration)}</span><h1>${escapeHtml(m.title)}</h1><p class="module-lead">${escapeHtml(m.subtitle)}</p></div>
            <button class="btn" type="button" data-go="overview">Course map</button>
          </div>
          <div class="module-body">
            <section class="learning-card"><h2>Learning objectives</h2><ul>${m.objectives.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul></section>
            <section class="theory-card">
              ${m.sections.map(s=>`<div><h3>${escapeHtml(s.title)}</h3>${s.paragraphs.map(p=>`<p>${escapeHtml(p)}</p>`).join("")}${s.lens?`<div class="lens"><strong>Apply this</strong><p>${escapeHtml(s.lens)}</p></div>`:""}</div>`).join("")}
              <div class="diagram" aria-label="Module decision sequence">${m.diagram.map(x=>`<div>${escapeHtml(x)}</div>`).join("")}</div>
            </section>
            <section class="case-card" id="case-${m.id}">
              <span class="case-label">Applied aviation decision</span><h2>${escapeHtml(m.caseStudy.title)}</h2>
              <p>${escapeHtml(m.caseStudy.scenario)}</p>
              <div class="case-data">${m.caseStudy.data.map(x=>{const parts=x.split(":");return `<div class="data-point"><strong>${escapeHtml(parts[0])}</strong>${escapeHtml(parts.slice(1).join(":")||"")}</div>`}).join("")}</div>
              <p class="question">What would you do?</p>
              <div class="options">${m.caseStudy.options.map((o,i)=>`<button class="option ${caseAnswer!==undefined?(i===m.caseStudy.correct?"correct":(Number(caseAnswer)===i?"incorrect":"")):""}" type="button" data-case-option="${i}">${escapeHtml(o)}</button>`).join("")}</div>
              ${caseAnswer!==undefined?`<div class="feedback ${Number(caseAnswer)===m.caseStudy.correct?"good":"bad"}">${escapeHtml(m.caseStudy.feedback[Number(caseAnswer)])}</div>`:""}
            </section>
            <section class="check-card" id="check-${m.id}">
              <span class="case-label" style="color:var(--teal)">Module checkpoint</span><h2>Check your understanding</h2>
              <p class="question">${escapeHtml(m.check.q)}</p>
              <div class="options">${m.check.options.map((o,i)=>`<button class="option ${checkAnswer!==undefined?(i===m.check.correct?"correct":(Number(checkAnswer)===i?"incorrect":"")):""}" type="button" data-check-option="${i}">${escapeHtml(o)}</button>`).join("")}</div>
              ${checkAnswer!==undefined?`<div class="feedback ${checkPassed?"good":"bad"}">${checkPassed?escapeHtml(m.check.explain):"Not quite. Review the theory and choose another answer; the correct response must be selected to complete the module."}</div>`:""}
            </section>
            <section class="completion-card">
              <h2>${moduleComplete(id)?"Module completed":"Complete the module"}</h2>
              <p>${checkPassed?"Your checkpoint is correct. Save this module as completed.":"Answer the checkpoint correctly to activate completion."}</p>
              <button class="btn btn-teal" type="button" id="completeModule" ${checkPassed?"":"disabled"}>${moduleComplete(id)?"Completed ✓":"Mark module complete"}</button>
            </section>
          </div>
          <nav class="module-nav" aria-label="Module navigation">
            <button class="btn" type="button" data-go="${id===1?"overview":`module-${id-1}`}">← ${id===1?"Overview":"Previous module"}</button>
            <button class="btn btn-primary" type="button" data-go="${id===MODULES.length?"assessment":`module-${id+1}`}">${id===MODULES.length?"Final assessment":"Next module"} →</button>
          </nav>
        </div>`;
      bindCommon();
      document.querySelectorAll("[data-case-option]").forEach(btn=>btn.addEventListener("click",()=>{
        state.cases[id]=Number(btn.dataset.caseOption); saveState(); renderModule(id); document.getElementById(`case-${id}`).scrollIntoView({behavior:"smooth",block:"center"});
      }));
      document.querySelectorAll("[data-check-option]").forEach(btn=>btn.addEventListener("click",()=>{
        state.checks[id]=Number(btn.dataset.checkOption); saveState(); renderModule(id); document.getElementById(`check-${id}`).scrollIntoView({behavior:"smooth",block:"center"});
      }));
      document.getElementById("completeModule").addEventListener("click",()=>{
        if (!checkPassed) return;
        if (!moduleComplete(id)) state.completed.push(id);
        state.completed = [...new Set(state.completed)].sort((a,b)=>a-b); saveState();
        if (id < MODULES.length) go(`module-${id+1}`); else go("assessment");
      });
    }

    function renderAssessment(){
      if (state.completed.length < MODULES.length){
        document.getElementById("main").innerHTML = `<div class="container module-shell"><div class="assessment-lock"><h1 style="color:var(--navy);font-size:44px">Assessment locked</h1><p>Complete all eight module checkpoints first.</p><button class="btn btn-primary" type="button" data-go="overview">Return to course map</button></div></div>`;
        return bindCommon();
      }
      if (state.finalScore !== null) return renderResults();
      document.getElementById("main").innerHTML = `
        <div class="container module-shell">
          <div class="module-top"><div><span class="eyebrow">Final assessment</span><h1>Integrated knowledge check</h1><p class="module-lead">Answer all ten questions. You need 80% to complete the course, and you can retry.</p></div><button class="btn" type="button" data-go="overview">Course map</button></div>
          <div class="assessment-list">
            ${FINAL_QUESTIONS.map((q,qi)=>`<section class="assessment-question"><h3>${qi+1}. ${escapeHtml(q.q)}</h3><div class="options">${q.options.map((o,oi)=>`<button class="option ${Number(state.finalAnswers[qi])===oi?"selected":""}" type="button" data-final-q="${qi}" data-final-option="${oi}">${escapeHtml(o)}</button>`).join("")}</div></section>`).join("")}
          </div>
          <div class="completion-card" style="margin-top:20px"><h2>Submit your answers</h2><p>${Object.keys(state.finalAnswers).length} of ${FINAL_QUESTIONS.length} answered.</p><button class="btn btn-teal" type="button" id="submitFinal" ${Object.keys(state.finalAnswers).length===FINAL_QUESTIONS.length?"":"disabled"}>Submit assessment</button></div>
        </div>`;
      bindCommon();
      document.querySelectorAll("[data-final-q]").forEach(btn=>btn.addEventListener("click",()=>{
        state.finalAnswers[btn.dataset.finalQ]=Number(btn.dataset.finalOption); saveState(); renderAssessment();
        document.querySelector(`[data-final-q="${btn.dataset.finalQ}"]`).closest(".assessment-question").scrollIntoView({block:"center"});
      }));
      document.getElementById("submitFinal").addEventListener("click",()=>{
        let correct=0; FINAL_QUESTIONS.forEach((q,i)=>{if(Number(state.finalAnswers[i])===q.correct) correct++;});
        state.finalScore=Math.round(correct/FINAL_QUESTIONS.length*100); state.passed=state.finalScore>=80; saveState(); renderResults(); window.scrollTo({top:0,behavior:"smooth"});
      });
    }

    function renderResults(){
      const passed=state.passed;
      document.getElementById("main").innerHTML = `
        <div class="container module-shell">
          <section class="result-panel">
            <span class="eyebrow">Assessment result</span><div class="score">${state.finalScore}%</div>
            <h1 style="color:var(--navy);font-size:46px;margin:14px auto">${passed?"Course completed":"Review and try again"}</h1>
            <p>${passed?"You have demonstrated an integrated foundation in aviation sustainability decision-making.":"The pass mark is 80%. Review the modules indicated by the questions and attempt the assessment again."}</p>
            <div class="hero-actions" style="justify-content:center">
              <button class="btn" type="button" data-go="overview">Course overview</button>
              ${passed?'<button class="btn btn-teal" type="button" id="printCertificate">Print completion record</button>':'<button class="btn btn-primary" type="button" id="retryFinal">Retry assessment</button>'}
            </div>
          </section>
          ${passed?`<section class="certificate"><span class="eyebrow">Completion record</span><h2>Introduction to Sustainability in Aviation</h2><p>This record confirms successful completion of the eight-module learning journey and final integrated assessment.</p><p><strong>Result: ${state.finalScore}%</strong></p><p style="font-size:13px">Generated locally in the learner's browser. This is an educational completion record, not a regulated qualification.</p></section>`:""}
        </div>`;
      bindCommon();
      if(passed) document.getElementById("printCertificate").addEventListener("click",()=>window.print());
      else document.getElementById("retryFinal").addEventListener("click",()=>{state.finalAnswers={};state.finalScore=null;state.passed=false;saveState();renderAssessment();});
    }

    function bindCommon(){
      document.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>go(el.dataset.go)));
      document.querySelectorAll("[data-scroll]").forEach(el=>el.addEventListener("click",()=>document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:"smooth"})));
      updateHeader();
      window.scrollTo(0,0);
      document.getElementById("main").focus({preventScroll:true});
    }
    function route(){
      const hash=(location.hash||"#overview").slice(1);
      if(hash.startsWith("module-")) renderModule(Number(hash.split("-")[1]));
      else if(hash==="assessment") renderAssessment();
      else renderOverview();
    }
    document.getElementById("overviewBtn").addEventListener("click",()=>go("overview"));
    document.getElementById("resetBtn").addEventListener("click",()=>{
      if(confirm("Reset all course progress and assessment answers?")){state={...defaultState,completed:[],cases:{},checks:{},finalAnswers:{}};saveState();go("overview");route();}
    });
    window.addEventListener("hashchange",route);
    route();
  </script>
</body>
</html>
